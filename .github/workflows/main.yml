name: Build custom RootHide IPA

on:
  push:
    branches: ['custom/3.x_roothide']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-roothide-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install native tools
        run: |
          brew install make ldid libarchive openssl@3 pkg-config dpkg xz zstd ripgrep
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "THEOS=$RUNNER_TEMP/roothide-theos" >> "$GITHUB_ENV"
          echo "BUILD_TIMESTAMP=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: theos-cache
        with:
          path: ${{ runner.temp }}/roothide-theos
          key: roothide-theos-${{ runner.os }}-${{ runner.arch }}-3ac89c9-sdk16.5-v1
      - name: Prepare pinned RootHide Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/roothide/theos "$THEOS"
          git -C "$THEOS" checkout 3ac89c984ec652fd16bcd91b33ae16de45ce76fa
          git -C "$THEOS" submodule update --init --recursive
          mkdir -p "$THEOS/sdks"
          curl --fail --location --retry 3 https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o "$RUNNER_TEMP/sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/sdk.tar.xz" -C "$THEOS/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
      - name: Build pinned trustcache tool
        run: |
          git clone https://github.com/CRKatri/trustcache "$RUNNER_TEMP/trustcache"
          git -C "$RUNNER_TEMP/trustcache" checkout aa0e8847529cf76576fce8d2dbc9e088c8f1a0df
          make -C "$RUNNER_TEMP/trustcache" -j4 OPENSSL=1 CFLAGS="-DOPENSSL -I$(brew --prefix openssl@3)/include" LDFLAGS="-L$(brew --prefix openssl@3)/lib"
          echo "$RUNNER_TEMP/trustcache" >> "$GITHUB_PATH"
      - name: Test source migration on temporary fixtures
        run: |
          clang -fobjc-arc -fmodules -framework Foundation -IApplication/Dopamine/Backup Tests/source_migration_tests.m Application/Dopamine/Backup/DOSourceMigration.m -o "$RUNNER_TEMP/source-tests"
          sudo "$RUNNER_TEMP/source-tests"
          clang -fobjc-arc -fmodules -framework Foundation -IApplication/Dopamine/Extensions Tests/version_identity_tests.m Application/Dopamine/Extensions/NSString+Version.m -o "$RUNNER_TEMP/version-tests"
          "$RUNNER_TEMP/version-tests"
      - name: Run custom regression checks
        run: |
          for test in Tests/*_checks.py; do
            [ ! -f "$test" ] || python3 "$test"
          done
          if [ -f Tests/run_backup_tests.sh ]; then bash Tests/run_backup_tests.sh; fi
      - name: Build complete jailbreak and application
        run: |
          set -o pipefail
          make -j4 NIGHTLY=0 BUILD_STANDALONE=0 2>&1 | tee "$RUNNER_TEMP/dopamine-build.log"
      - name: Verify and package delivery
        run: |
          python3 Tools/verify_delivery.py Application/Dopamine.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Dopamine-custom-${{ github.sha }}
          path: |
            Application/Dopamine.ipa
            Application/Dopamine.tipa
            Application/Dopamine.ipa.sha256
            Application/verification.json
          if-no-files-found: error
      - name: Upload logs even after failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-logs-${{ github.sha }}
          path: ${{ runner.temp }}/dopamine-build.log
          if-no-files-found: ignore
